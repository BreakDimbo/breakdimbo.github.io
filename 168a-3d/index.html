<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef0ea"><title>168A · Three.js 空间重构</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#eef0ea;color:#20372d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.loading{text-align:center}.loading b{display:block;font-size:20px;margin-bottom:8px}.loading span{font-size:11px;color:#7d8b82}.error{max-width:520px;padding:24px;line-height:1.7}</style></head><body><div class="loading" id="status"><b>AXIS.</b><span>正在加载 168A 三维空间…</span></div><script>(async()=>{try{const urls=Array.from({length:7},(_,i)=>`./p${i+1}.txt?v=20260906-1`);const parts=await Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`${u} · HTTP ${r.status}`);return r.text()}));const b64=parts.join('').replace(/\s/g,'');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const html=new TextDecoder('utf-8').decode(bytes);document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML=`<div class="error"><b>168A 模型暂时未能加载</b><br><small>${String(e.message||e)}</small><br><br>请刷新页面重试。</div>`}})();</script></body></html>
